# Emitter config for the azure-ai-projects Java SDK TypeSpec project.
#
# Compile the project's entrypoint (client.tsp) with this config; the spec path
# is supplied on the command line (see the foundry:emit:projects npm script).
#
# The `imports` mirror the spec project's own tspconfig so all decorators and
# namespaces (@route, @scope, @operationId, OpenAI models, ...) resolve.
# Java type names come from TCGC (which applies @clientName and access). The
# base package is pinned via `java-namespace` to match the typespec-java
# emitter's `namespace` option in the spec project's tspconfig.yaml.

output-dir: "{cwd}/foundry/tsp-output"

emit:
  - typespec-extension-exporter

imports:
  - "@azure-tools/typespec-azure-core"
  - "@azure-tools/typespec-azure-core/experimental"
  - "@azure-tools/typespec-client-generator-core"
  - "@azure-tools/openai-typespec/models/evals"
  - "@azure-tools/openai-typespec/models/fine-tuning"
  - "@azure-tools/openai-typespec/models/responses"

options:
  typespec-extension-exporter:
    keys: x-ms-foundry-meta
    # Default Foundry flow generates revapi suppressions as JSON.
    # To generate AST customization annotation input instead, use:
    #   output-shape: tsp-ast-input
    #   output-file: projects.tsp-ast-input.json
    # To serialize the selected shape differently, update output-format and
    # output-file together (or remove output-file to use the default extension):
    #   output-format: yaml # or json/csv
    #   output-file: projects.revapi.yaml
    # Or override from the CLI:
    #   --option typespec-extension-exporter.output-shape=tsp-ast-input
    #   --option typespec-extension-exporter.output-file=projects.tsp-ast-input.json
    output-shape: revapi
    output-format: json
    output-file: projects.revapi.json
    java-namespace: com.azure.ai.projects
